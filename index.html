<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#14161a" />
<title>コスポーズ｜ポージング・立ち位置 共有</title>
<meta name="description" content="棒人形でコスプレのポージングと立ち位置を作ってリンクで共有" />
<link rel="stylesheet" href="css/styles.css" />

<div id="app">
  <header id="toolbar">
    <div class="tb-left">
      <button id="btnAspect" class="tb-btn" title="構図">📐 <span id="aspectLabel">縦 3:4</span></button>
      <button id="btnAdd" class="tb-btn">＋ 人形</button>
      <button id="btnBg" class="tb-btn">🖼 背景</button>
    </div>
    <div class="tb-right">
      <button id="btnShare" class="tb-btn primary">🔗 共有</button>
      <button id="btnReset" class="tb-btn" title="全消去">🗑</button>
    </div>
  </header>

  <main id="stageWrap">
    <svg id="stage" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <rect id="plate" x="0" y="0" />
      <image id="bgImage" x="0" y="0" preserveAspectRatio="xMidYMid slice" />
      <rect id="frame" x="0" y="0" />
      <g id="figures"></g>
    </svg>
    <p id="hint">人形をタップ→下のポーズや関節（丸）を操作。ドラッグで移動。</p>
  </main>

  <footer id="panel" class="hidden">
    <div class="panel-row poses" id="poseRow"></div>
    <div class="panel-row controls">
      <div class="colors" id="colorRow"></div>
      <div class="spacer"></div>
      <button class="ctl" data-act="smaller">➖</button>
      <button class="ctl" data-act="bigger">➕</button>
      <button class="ctl" data-act="flip">↔ 反転</button>
      <button class="ctl" data-act="dup">⧉ 複製</button>
      <button class="ctl danger" data-act="del">🗑 削除</button>
    </div>
  </footer>
</div>

<!-- 構図モーダル -->
<div id="aspectModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h2>構図</h2><button class="x" data-close>✕</button></div>
    <div id="aspectList" class="chip-list"></div>
  </div>
</div>

<!-- 背景モーダル -->
<div id="bgModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><h2>背景</h2><button class="x" data-close>✕</button></div>
    <label class="upload-btn">
      画像をアップロード
      <input id="bgUpload" type="file" accept="image/*" hidden />
    </label>
    <h3>プリセット</h3>
    <div id="presetList" class="thumb-list"></div>
    <h3>アップロード済み <span class="note">（この端末のみ・共有リンクには含まれません）</span></h3>
    <div id="uploadList" class="thumb-list"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/app.js"></script>
